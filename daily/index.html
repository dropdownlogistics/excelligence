<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Daily Grid — Excelligence</title>
<meta name="description" content="One formula challenge, every day. No hints about which function — figure it out from the problem.">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#0D1B2A;--card:#10202f;--card2:#0e1c2a;
  --cream:#F5F1EB;--steel:#6B7B8D;--muted:#4A5A6A;
  --gold:#D4A843;--gold2:rgba(212,168,67,0.1);--gold3:rgba(212,168,67,0.05);
  --crimson:#B23531;--crimson2:rgba(178,53,49,0.12);
  --green:#4A9E6B;--green2:rgba(74,158,107,0.12);
  --blue:#6B9DC2;--amber:#C49A3C;--violet:#8a6cc9;--teal:#4AADAD;
  --border:rgba(245,241,235,0.07);--border2:rgba(245,241,235,0.13);
  --frm:#6B9DC2;--ptn:#4A9E6B;--arc:#8a6cc9;--ant:#B23531;--con:#C49A3C;--pq:#4AADAD;--key:#D4A843;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes flash-green{0%,100%{background:var(--card)}50%{background:var(--green2)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}

html{scroll-behavior:smooth}
body{background:var(--navy);color:var(--cream);font-family:'Space Grotesk',sans-serif;min-height:100vh;overflow-x:hidden;padding-bottom:80px}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(212,168,67,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(212,168,67,0.015) 1px,transparent 1px);
  background-size:48px 48px;}

/* NAV */
nav{position:sticky;top:0;z-index:100;background:rgba(13,27,42,0.95);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);height:58px;padding:0 48px;
  display:flex;align-items:center;justify-content:space-between;}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.nav-word{font-size:1rem;font-weight:700;letter-spacing:-0.02em;color:var(--cream)}
.nav-word span{color:var(--gold)}
.nav-right{display:flex;gap:20px;align-items:center}
.nav-link{font-family:'JetBrains Mono',monospace;font-size:0.6rem;color:var(--steel);
  text-decoration:none;letter-spacing:0.08em;text-transform:uppercase;transition:color 0.2s}
.nav-link:hover,.nav-link.active{color:var(--cream)}
.streak-badge{font-family:'JetBrains Mono',monospace;font-size:0.62rem;color:var(--gold);
  background:var(--gold2);border:1px solid rgba(212,168,67,0.25);
  padding:4px 12px;border-radius:4px;display:flex;align-items:center;gap:6px}
.streak-fire{font-size:0.8rem}

/* PAGE */
.page{max-width:780px;margin:0 auto;padding:0 40px;position:relative;z-index:1}

/* HERO */
.hero{padding:52px 0 36px;border-bottom:1px solid var(--border);margin-bottom:40px;
  display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap}
.hero-left{}
.hero-eyebrow{font-family:'JetBrains Mono',monospace;font-size:0.6rem;color:var(--gold);
  letter-spacing:0.14em;text-transform:uppercase;margin-bottom:10px;
  display:flex;align-items:center;gap:8px}
.hero-eyebrow::before{content:'';width:14px;height:1px;background:var(--gold)}
.hero h1{font-size:2rem;font-weight:700;letter-spacing:-0.03em;line-height:1.0;margin-bottom:8px}
.hero-date{font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:var(--steel);
  letter-spacing:0.06em}
.hero-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.challenge-num{font-family:'JetBrains Mono',monospace;font-size:0.65rem;color:var(--steel);
  letter-spacing:0.08em;text-transform:uppercase}
.type-badge{font-family:'JetBrains Mono',monospace;font-size:0.62rem;font-weight:600;
  letter-spacing:0.1em;text-transform:uppercase;padding:4px 12px;border-radius:4px}

/* CHALLENGE CARD */
.challenge-card{background:var(--card);border:1px solid var(--border2);border-radius:12px;
  padding:28px 28px 24px;margin-bottom:28px;animation:fadeUp 0.4s ease both}
.challenge-title{font-size:1.05rem;font-weight:700;letter-spacing:-0.01em;margin-bottom:6px}
.challenge-context{font-family:'Source Serif 4',serif;font-size:0.88rem;color:var(--steel);
  line-height:1.6;margin-bottom:20px}

/* MINI SPREADSHEET */
.sheet-wrap{margin-bottom:20px;overflow-x:auto}
.sheet{border-collapse:collapse;font-family:'JetBrains Mono',monospace;font-size:0.7rem;
  border:1px solid rgba(245,241,235,0.15);border-radius:4px;overflow:hidden;min-width:300px}
.sheet th{background:rgba(255,255,255,0.04);color:var(--steel);padding:5px 12px;
  font-weight:500;border:1px solid rgba(245,241,235,0.1);text-align:center;
  letter-spacing:0.04em;font-size:0.62rem}
.sheet th.row-header{width:28px;color:var(--muted)}
.sheet td{padding:6px 12px;border:1px solid rgba(245,241,235,0.08);color:var(--cream);
  white-space:nowrap}
.sheet td.row-num{background:rgba(255,255,255,0.03);color:var(--muted);text-align:center;font-size:0.62rem}
.sheet td.header-cell{background:rgba(212,168,67,0.07);color:var(--gold);font-weight:600}

/* TARGET */
.target-row{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.target-label{font-family:'JetBrains Mono',monospace;font-size:0.6rem;color:var(--steel);
  letter-spacing:0.1em;text-transform:uppercase;white-space:nowrap}
.target-value{font-family:'JetBrains Mono',monospace;font-size:0.82rem;color:var(--gold);
  background:var(--gold2);border:1px solid rgba(212,168,67,0.2);
  padding:5px 14px;border-radius:4px;font-weight:500}

/* INPUT AREA */
.input-section{margin-bottom:20px}
.input-label{font-family:'JetBrains Mono',monospace;font-size:0.6rem;color:var(--steel);
  letter-spacing:0.1em;text-transform:uppercase;margin-bottom:8px;
  display:flex;justify-content:space-between;align-items:center}
.attempts-left{font-size:0.58rem;color:var(--muted)}
.formula-input{width:100%;background:var(--card2);border:1px solid var(--border2);
  border-radius:8px;color:var(--cream);font-family:'JetBrains Mono',monospace;
  font-size:0.88rem;padding:14px 16px;outline:none;transition:border-color 0.2s;
  letter-spacing:0.02em}
.formula-input:focus{border-color:var(--gold)}
.formula-input::placeholder{color:var(--muted)}
.formula-input.correct{border-color:var(--green);animation:flash-green 0.6s ease}
.formula-input.wrong{animation:shake 0.4s ease}
.formula-input:disabled{opacity:0.5;cursor:not-allowed}

/* BUTTONS */
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-submit{background:var(--gold);color:#0D1B2A;font-family:'Space Grotesk',sans-serif;
  font-size:0.82rem;font-weight:700;padding:11px 24px;border:none;border-radius:6px;
  cursor:pointer;letter-spacing:0.02em;transition:opacity 0.15s}
.btn-submit:hover{opacity:0.88}
.btn-submit:disabled{opacity:0.4;cursor:not-allowed}
.btn-hint{background:transparent;color:var(--steel);font-family:'JetBrains Mono',monospace;
  font-size:0.65rem;padding:10px 16px;border:1px solid var(--border2);border-radius:6px;
  cursor:pointer;letter-spacing:0.06em;text-transform:uppercase;transition:all 0.15s;display:none}
.btn-hint:hover{color:var(--cream);border-color:rgba(245,241,235,0.25)}
.btn-hint.visible{display:block}
.btn-give-up{background:transparent;color:var(--muted);font-family:'JetBrains Mono',monospace;
  font-size:0.62rem;padding:10px 16px;border:1px solid var(--border);border-radius:6px;
  cursor:pointer;letter-spacing:0.06em;text-transform:uppercase;transition:all 0.15s}
.btn-give-up:hover{color:var(--steel)}

/* HINT BOX */
.hint-box{background:rgba(212,168,67,0.06);border:1px solid rgba(212,168,67,0.2);
  border-radius:8px;padding:12px 16px;margin-top:12px;display:none}
.hint-box.visible{display:block}
.hint-box p{font-family:'Source Serif 4',serif;font-size:0.85rem;color:var(--steel);
  line-height:1.6}
.hint-box strong{color:var(--cream)}

/* FEEDBACK */
.feedback{margin-top:12px;font-family:'JetBrains Mono',monospace;font-size:0.72rem;
  padding:9px 14px;border-radius:6px;display:none}
.feedback.visible{display:block}
.feedback.wrong{background:var(--crimson2);color:var(--crimson);border:1px solid rgba(178,53,49,0.2)}
.feedback.correct{background:var(--green2);color:var(--green);border:1px solid rgba(74,158,107,0.2)}

/* REVEAL CARD */
.reveal-card{background:var(--card2);border:1px solid var(--border2);border-radius:12px;
  padding:24px;margin-top:24px;display:none;animation:fadeUp 0.4s ease both}
.reveal-card.visible{display:block}
.reveal-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.reveal-badge{font-family:'JetBrains Mono',monospace;font-size:0.62rem;font-weight:600;
  letter-spacing:0.1em;text-transform:uppercase;padding:3px 10px;border-radius:4px}
.reveal-id{font-family:'JetBrains Mono',monospace;font-size:0.72rem;color:var(--muted)}
.reveal-name{font-size:1rem;font-weight:700;letter-spacing:-0.02em;margin-bottom:6px}
.reveal-tier{font-family:'JetBrains Mono',monospace;font-size:0.58rem;color:var(--steel);
  letter-spacing:0.1em;text-transform:uppercase;margin-bottom:12px}
.solution-line{font-family:'JetBrains Mono',monospace;font-size:0.78rem;color:var(--cream);
  background:var(--card);border:1px solid var(--border2);border-left:3px solid var(--gold);
  padding:10px 14px;border-radius:4px;margin-bottom:12px;line-height:1.5;word-break:break-all}
.reveal-note{font-family:'Source Serif 4',serif;font-size:0.88rem;color:var(--steel);line-height:1.65}
.reveal-note strong{color:var(--cream)}
.reveal-link{font-family:'JetBrains Mono',monospace;font-size:0.62rem;color:var(--gold);
  text-decoration:none;letter-spacing:0.06em;display:inline-flex;align-items:center;gap:6px;
  margin-top:12px;transition:opacity 0.15s}
.reveal-link:hover{opacity:0.75}

/* SHARE SECTION */
.share-section{margin-top:24px;padding-top:24px;border-top:1px solid var(--border);display:none}
.share-section.visible{display:block}
.share-result{font-family:'JetBrains Mono',monospace;font-size:0.78rem;
  background:var(--card);border:1px solid var(--border2);border-radius:8px;
  padding:14px 16px;margin-bottom:12px;white-space:pre-wrap;line-height:1.6;color:var(--cream)}
.btn-share{background:var(--card);color:var(--cream);font-family:'JetBrains Mono',monospace;
  font-size:0.65rem;padding:9px 18px;border:1px solid var(--border2);border-radius:6px;
  cursor:pointer;letter-spacing:0.06em;text-transform:uppercase;transition:all 0.15s}
.btn-share:hover{border-color:rgba(245,241,235,0.25);color:var(--cream)}
.copied-msg{font-family:'JetBrains Mono',monospace;font-size:0.62rem;color:var(--green);
  margin-left:10px;opacity:0;transition:opacity 0.3s}
.copied-msg.show{opacity:1}

/* HISTORY DOTS */
.history-row{display:flex;align-items:center;gap:6px;margin-top:8px}
.history-dot{width:10px;height:10px;border-radius:50%}

/* MOBILE */
@media(max-width:600px){
  nav{padding:0 20px}
  .page{padding:0 20px}
  .hero{padding:36px 0 28px}
  .challenge-card{padding:20px}
  .hero h1{font-size:1.6rem}
}
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="/">
    <svg width="22" height="22" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="18" cy="18" r="17" stroke="#D4A843" stroke-width="1.5" opacity="0.5"/>
      <circle cx="18" cy="18" r="6" fill="#D4A843" opacity="0.9"/>
    </svg>
    <span class="nav-word">Excel<span>ligence</span></span>
  </a>
  <div class="nav-right">
    <span class="streak-badge" id="streakBadge" style="display:none">
      <span class="streak-fire">🔥</span>
      <span id="streakCount">0</span>-day streak
    </span>
    <a class="nav-link" href="/explorer/">Graph</a>
    <a class="nav-link" href="/scanner/">Scanner</a>
    <a class="nav-link active" href="/daily/">Daily</a>
    <a class="nav-link" href="/formulalab/">FormulaLab</a>
  </div>
</nav>

<div class="page">
  <div class="hero">
    <div class="hero-left">
      <div class="hero-eyebrow">Daily Grid</div>
      <h1>One formula.<br>Every day.</h1>
      <div class="hero-date" id="heroDate">Loading…</div>
    </div>
    <div class="hero-right">
      <div class="challenge-num" id="challengeNum"></div>
      <div class="type-badge" id="typeBadge"></div>
      <div class="hero-right" id="tierLabel" style="font-family:'JetBrains Mono',monospace;font-size:0.6rem;color:var(--steel);letter-spacing:0.08em;text-transform:uppercase"></div>
    </div>
  </div>

  <div class="challenge-card" id="challengeCard">
    <div class="challenge-title" id="challengeTitle"></div>
    <div class="challenge-context" id="challengeContext"></div>
    <div class="sheet-wrap" id="sheetWrap"></div>
    <div class="target-row" style="margin-bottom:20px">
      <span class="target-label">Produce:</span>
      <span class="target-value" id="targetValue"></span>
    </div>
    <div class="input-section">
      <div class="input-label">
        <span>Your formula or answer</span>
        <span class="attempts-left" id="attemptsLeft"></span>
      </div>
      <input type="text" class="formula-input" id="formulaInput"
        placeholder="=FUNCTION(args…)  or describe the answer" autocomplete="off" spellcheck="false">
      <div class="feedback" id="feedback"></div>
      <div class="hint-box" id="hintBox"><p id="hintText"></p></div>
    </div>
    <div class="btn-row">
      <button class="btn-submit" id="btnSubmit" onclick="submitAnswer()">Submit</button>
      <button class="btn-hint" id="btnHint" onclick="showHint()">Show hint</button>
      <button class="btn-give-up" id="btnGiveUp" onclick="giveUp()">Give up</button>
    </div>
    <div class="reveal-card" id="revealCard">
      <div class="reveal-header">
        <span class="reveal-badge" id="revealBadge"></span>
        <span class="reveal-id" id="revealId"></span>
      </div>
      <div class="reveal-name" id="revealName"></div>
      <div class="reveal-tier" id="revealTier"></div>
      <div class="solution-line" id="revealSolution"></div>
      <div class="reveal-note" id="revealNote"></div>
      <a class="reveal-link" href="/learn/" id="revealLink">View registry entry →</a>
    </div>
    <div class="share-section" id="shareSection">
      <div class="share-result" id="shareText"></div>
      <button class="btn-share" onclick="copyShare()">Copy result</button>
      <span class="copied-msg" id="copiedMsg">Copied!</span>
    </div>
  </div>
</div>

<script>
const CHALLENGES = [
  {id:'c001',entry_id:'FRM-0001',entry_name:'XLOOKUP',entry_type:'FRM',tier:'Intermediate',
   title:'Find the unit price for "Bearing Assembly"',
   context:'Parts catalog. Find the price for a specific part name.',
   data:{headers:['Part Name','Unit Price'],rows:[['Valve Seal','$4.20'],['Bearing Assembly','$11.75'],['Gasket Kit','$6.50'],['Drive Shaft','$38.00']]},
   target:'$11.75',
   accepted:['XLOOKUP','VLOOKUP','INDEX','FILTER','MATCH'],
   solution:'=XLOOKUP("Bearing Assembly", A2:A5, B2:B5)',
   hint:'Look up a value in one column and return the corresponding value from another column in the same row.',
   note:'XLOOKUP is the modern replacement for VLOOKUP — cleaner syntax, returns values to the left, has a built-in if-not-found argument.'},

  {id:'c002',entry_id:'FRM-0003',entry_name:'FILTER',entry_type:'FRM',tier:'Intermediate',
   title:'Return only the East region rows',
   context:'Regional inventory with three columns. Show only East region entries.',
   data:{headers:['Part','Region','Qty'],rows:[['Valve','East','120'],['Gasket','West','85'],['Bearing','East','200'],['Seal','North','60']]},
   target:'Valve/120 and Bearing/200 (two rows, all columns)',
   accepted:['FILTER'],
   solution:'=FILTER(A2:C5, B2:B5="East")',
   hint:'Extract only the rows where a condition is true — the result spills automatically.',
   note:'FILTER returns a spilled array of all matching rows — no helper columns, no Ctrl+Shift+Enter.'},

  {id:'c003',entry_id:'FRM-0004',entry_name:'UNIQUE',entry_type:'FRM',tier:'Intermediate',
   title:'List each department exactly once',
   context:'Employee list with repeated departments. Extract the distinct names.',
   data:{headers:['Employee','Department'],rows:[['Reyes','Engineering'],['Park','Finance'],['Osei','Engineering'],['Torres','HR'],['Kim','Finance']]},
   target:'Engineering, Finance, HR  (each once)',
   accepted:['UNIQUE'],
   solution:'=UNIQUE(B2:B6)',
   hint:'Deduplicate a column — one formula, no Remove Duplicates.',
   note:'UNIQUE spills a deduplicated list. Combine with SORT to get an alphabetical unique list.'},

  {id:'c004',entry_id:'FRM-0009',entry_name:'SUMIFS',entry_type:'FRM',tier:'Beginner',
   title:'Total Q2 sales for the West region only',
   context:'Sales log by quarter and region. Two conditions must both be true.',
   data:{headers:['Quarter','Region','Sales'],rows:[['Q1','West','14200'],['Q2','East','18500'],['Q2','West','22100'],['Q3','West','9800'],['Q2','West','16400']]},
   target:'38500',
   accepted:['SUMIFS','SUMIF','SUMPRODUCT','FILTER'],
   solution:'=SUMIFS(C2:C6, A2:A6, "Q2", B2:B6, "West")',
   hint:'Sum a column, but only where two other columns match specific values.',
   note:'SUMIFS is the workhorse of analytical worksheets — multiple criteria, one formula.'},

  {id:'c005',entry_id:'FRM-0010',entry_name:'COUNTIFS',entry_type:'FRM',tier:'Beginner',
   title:'Count inspections that are both PASS and High priority',
   context:'Inspection log. Two columns must match simultaneously.',
   data:{headers:['Inspector','Result','Priority'],rows:[['Walsh','PASS','High'],['Diaz','FAIL','High'],['Walsh','PASS','Low'],['Chen','PASS','High'],['Diaz','PASS','High']]},
   target:'3',
   accepted:['COUNTIFS','COUNTIF','SUMPRODUCT','FILTER'],
   solution:'=COUNTIFS(B2:B6, "PASS", C2:C6, "High")',
   hint:'Count rows where two columns both match conditions.',
   note:'COUNTIFS is COUNTIF with multiple criteria — no array formula needed.'},

  {id:'c006',entry_id:'FRM-0015',entry_name:'LET',entry_type:'FRM',tier:'Intermediate',
   title:'Calculate net margin % without repeating the revenue sub-expression',
   context:'Revenue = 80000, Cost = 52000. Net = Revenue − Cost. Margin% = Net / Revenue. Assign intermediate values inside one formula.',
   data:{headers:['Product','Revenue','Cost'],rows:[['Alpha','80000','52000']]},
   target:'35.00%  (no helper cells, no repeated B2 references)',
   accepted:['LET'],
   solution:'=LET(rev, B2, cost, C2, net, rev-cost, net/rev)',
   hint:'Name intermediate results inside the formula to avoid repeating the same sub-expression.',
   note:'LET assigns names to interim values — cleaner and faster than repeating the same calculation three times.'},

  {id:'c007',entry_id:'FRM-0025',entry_name:'IFERROR',entry_type:'FRM',tier:'Beginner',
   title:'Return "" instead of #N/A when the lookup finds no match',
   context:'Parts lookup. Some IDs have no entry in the catalog. The formula currently returns #N/A.',
   data:{headers:['Part ID','Lookup Result'],rows:[['P-001','Valve Seal'],['P-099','#N/A'],['P-003','Bearing']]},
   target:'"" (empty string) for P-099 instead of #N/A',
   accepted:['IFERROR','IFNA','XLOOKUP'],
   solution:'=IFERROR(XLOOKUP(A2, catalog_id, catalog_name), "")',
   hint:'Wrap the formula to catch errors and return something clean instead.',
   note:'IFERROR catches all errors. For #N/A specifically, IFNA is more precise — it leaves real errors visible.'},

  {id:'c008',entry_id:'FRM-0014',entry_name:'SEQUENCE',entry_type:'FRM',tier:'Intermediate',
   title:'Generate the numbers 1 through 8 without dragging a fill handle',
   context:'Dynamic numbering. One formula, spills downward automatically.',
   data:{headers:['Target output (spills from one formula cell):'],rows:[['1'],['2'],['3'],['4'],['5'],['6'],['7'],['8']]},
   target:'1, 2, 3, 4, 5, 6, 7, 8  (spilled from a single formula)',
   accepted:['SEQUENCE','ROW'],
   solution:'=SEQUENCE(8)',
   hint:'Generate a numbered list — no fill handle, no manual entry.',
   note:'SEQUENCE(rows, [cols], [start], [step]) is the building block for most array-formula indexing.'},

  {id:'c009',entry_id:'FRM-0022',entry_name:'TEXTJOIN',entry_type:'FRM',tier:'Intermediate',
   title:'Combine all city names with ", " between them in one formula',
   context:'Site list. Produce a single comma-separated string from a column of cities.',
   data:{headers:['Site','City'],rows:[['S-1','Denver'],['S-2','Atlanta'],['S-3','Portland'],['S-4','Cleveland']]},
   target:'"Denver, Atlanta, Portland, Cleveland"',
   accepted:['TEXTJOIN','CONCAT','CONCATENATE'],
   solution:'=TEXTJOIN(", ", TRUE, B2:B5)',
   hint:'Join multiple text values with a separator, ignoring any blank cells.',
   note:'TEXTJOIN accepts a range — no need to & each cell individually.'},

  {id:'c010',entry_id:'FRM-0001',entry_name:'XLOOKUP',entry_type:'FRM',tier:'Intermediate',
   title:'Look up vendor rating, return "Unknown" if the vendor is not in the list',
   context:'Vendor registry. Some PO vendors have not yet been rated.',
   data:{headers:['Vendor','Rating'],rows:[['Acme Supply','A'],['Global Parts','B+'],['FastShip Co','A-']]},
   target:'"Unknown" when the lookup vendor is not in the registry',
   accepted:['XLOOKUP','IFERROR','IFNA'],
   solution:'=XLOOKUP("New Vendor", A2:A4, B2:B4, "Unknown")',
   hint:'This function has a built-in argument for what to return when nothing matches — no IFERROR wrapper needed.',
   note:"XLOOKUP's 4th argument is the if_not_found value. Cleaner than wrapping VLOOKUP in IFERROR."},

// ── State ──────────────────────────────────────────────────────────────
const today = new Date();
const epochDay = Math.floor(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()) / 86400000);
const challenge = CHALLENGES[epochDay % CHALLENGES.length];
const challengeNum = epochDay % CHALLENGES.length + 1;

let attempts = 0;
const MAX_ATTEMPTS = 3;
let solved = false;
let revealed = false;

const LS_STREAK = 'eg_daily_streak';
const LS_LAST   = 'eg_daily_last';
const LS_HIST   = 'eg_daily_hist';

// ── Type colors ────────────────────────────────────────────────────────
const TYPE_COLORS = {
  FRM:{bg:'rgba(107,157,194,0.15)',color:'#6B9DC2',border:'rgba(107,157,194,0.3)'},
  ANT:{bg:'rgba(178,53,49,0.15)',color:'#B23531',border:'rgba(178,53,49,0.3)'},
  PQ: {bg:'rgba(74,173,173,0.15)',color:'#4AADAD',border:'rgba(74,173,173,0.3)'},
  ARC:{bg:'rgba(138,108,201,0.15)',color:'#8a6cc9',border:'rgba(138,108,201,0.3)'},
  CON:{bg:'rgba(196,154,60,0.15)',color:'#C49A3C',border:'rgba(196,154,60,0.3)'},
  PTN:{bg:'rgba(74,158,107,0.15)',color:'#4A9E6B',border:'rgba(74,158,107,0.3)'},
};

function typeStyle(t) {
  const c = TYPE_COLORS[t] || TYPE_COLORS.FRM;
  return `background:${c.bg};color:${c.color};border:1px solid ${c.border}`;
}

// ── Init ───────────────────────────────────────────────────────────────
function init() {
  const dateStr = today.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric', year:'numeric'});
  document.getElementById('heroDate').textContent = dateStr;
  document.getElementById('challengeNum').textContent = `Challenge #${challengeNum}`;

  const badge = document.getElementById('typeBadge');
  badge.textContent = challenge.entry_type;
  badge.setAttribute('style', typeStyle(challenge.entry_type) + ';font-family:"JetBrains Mono",monospace;font-size:0.62rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;padding:4px 12px;border-radius:4px');

  document.getElementById('tierLabel').textContent = challenge.tier;
  document.getElementById('challengeTitle').textContent = challenge.title;
  document.getElementById('challengeContext').textContent = challenge.context;
  document.getElementById('targetValue').textContent = challenge.target;
  document.getElementById('hintText').textContent = challenge.hint;

  buildSheet();
  updateAttempts();
  loadStreak();
  checkAlreadyPlayed();

  document.getElementById('formulaInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !solved && !revealed) submitAnswer();
  });
}

function buildSheet() {
  const d = challenge.data;
  let html = '<table class="sheet"><thead><tr><th class="row-header"></th>';
  d.headers.forEach((_, i) => {
    html += `<th>${String.fromCharCode(65 + i)}</th>`;
  });
  html += '</tr></thead><tbody>';
  // Header row (row 1)
  html += '<tr><td class="row-num">1</td>';
  d.headers.forEach(h => { html += `<td class="header-cell">${h}</td>`; });
  html += '</tr>';
  // Data rows
  d.rows.forEach((row, ri) => {
    html += `<tr><td class="row-num">${ri + 2}</td>`;
    row.forEach(cell => { html += `<td>${cell}</td>`; });
    html += '</tr>';
  });
  html += '</tbody></table>';
  document.getElementById('sheetWrap').innerHTML = html;
}

function updateAttempts() {
  const left = MAX_ATTEMPTS - attempts;
  document.getElementById('attemptsLeft').textContent = `${left} attempt${left !== 1 ? 's' : ''} remaining`;
}

// ── Streak ─────────────────────────────────────────────────────────────
function todayKey() {
  return `${today.getFullYear()}-${today.getMonth()}-${today.getDate()}`;
}

function loadStreak() {
  const streak = parseInt(localStorage.getItem(LS_STREAK) || '0', 10);
  if (streak > 0) {
    document.getElementById('streakCount').textContent = streak;
    document.getElementById('streakBadge').style.display = 'flex';
  }
}

function updateStreak(won) {
  const lastPlayed = localStorage.getItem(LS_LAST);
  const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
  const yesterdayKey = `${yesterday.getFullYear()}-${yesterday.getMonth()}-${yesterday.getDate()}`;
  let streak = parseInt(localStorage.getItem(LS_STREAK) || '0', 10);

  if (won) {
    if (lastPlayed === yesterdayKey || lastPlayed === todayKey()) {
      streak = lastPlayed === todayKey() ? streak : streak + 1;
    } else {
      streak = 1;
    }
  } else {
    streak = 0;
  }

  localStorage.setItem(LS_STREAK, streak);
  localStorage.setItem(LS_LAST, todayKey());

  if (streak > 0) {
    document.getElementById('streakCount').textContent = streak;
    document.getElementById('streakBadge').style.display = 'flex';
  } else {
    document.getElementById('streakBadge').style.display = 'none';
  }
}

function checkAlreadyPlayed() {
  const hist = JSON.parse(localStorage.getItem(LS_HIST) || '[]');
  const prev = hist.find(h => h.date === todayKey());
  if (prev) {
    solved = prev.solved;
    revealed = true;
    attempts = prev.attempts;
    updateAttempts();
    document.getElementById('formulaInput').disabled = true;
    document.getElementById('btnSubmit').disabled = true;
    document.getElementById('btnHint').style.display = 'none';
    document.getElementById('btnGiveUp').style.display = 'none';
    showReveal();
    showShare(prev.solved, prev.attempts);
    const fb = document.getElementById('feedback');
    fb.className = 'feedback visible ' + (prev.solved ? 'correct' : 'wrong');
    fb.textContent = prev.solved
      ? `Already solved today — ${prev.attempts} attempt${prev.attempts !== 1 ? 's' : ''}. Come back tomorrow!`
      : "Already played today. Come back tomorrow for a new challenge.";
  }
}

// ── Submit ─────────────────────────────────────────────────────────────
function submitAnswer() {
  if (solved || revealed) return;
  const raw = document.getElementById('formulaInput').value.trim();
  if (!raw) return;

  const normalized = raw.replace(/^=/, '').toUpperCase().replace(/\s+/g, '');
  const isCorrect = challenge.accepted.some(kw => normalized.includes(kw.toUpperCase().replace(/\s+/g, '')));

  attempts++;
  updateAttempts();

  const input = document.getElementById('formulaInput');
  const fb = document.getElementById('feedback');

  if (isCorrect) {
    solved = true;
    revealed = true;
    input.classList.add('correct');
    input.disabled = true;
    document.getElementById('btnSubmit').disabled = true;
    document.getElementById('btnHint').style.display = 'none';
    document.getElementById('btnGiveUp').style.display = 'none';
    fb.className = 'feedback visible correct';
    fb.textContent = attempts === 1 ? '✓ Correct! First try.' : `✓ Correct in ${attempts} ${attempts === 1 ? 'try' : 'tries'}.`;
    showReveal();
    showShare(true, attempts);
    saveHistory(true);
    updateStreak(true);
  } else {
    input.classList.add('wrong');
    setTimeout(() => input.classList.remove('wrong'), 500);
    fb.className = 'feedback visible wrong';

    if (attempts >= MAX_ATTEMPTS) {
      fb.textContent = `Not quite — the accepted answer uses: ${challenge.solution.split('=')[1] ? challenge.solution.substring(0, 30) + '…' : challenge.solution.substring(0, 30) + '…'}`;
      revealed = true;
      input.disabled = true;
      document.getElementById('btnSubmit').disabled = true;
      document.getElementById('btnHint').style.display = 'none';
      document.getElementById('btnGiveUp').style.display = 'none';
      showReveal();
      showShare(false, attempts);
      saveHistory(false);
      updateStreak(false);
    } else {
      fb.textContent = attempts === 1 ? 'Not quite. Try again — or show a hint.' : 'Still not right. One more attempt before reveal.';
      document.getElementById('btnHint').classList.add('visible');
    }
  }
}

function showHint() {
  document.getElementById('hintBox').classList.add('visible');
}

function giveUp() {
  revealed = true;
  document.getElementById('formulaInput').disabled = true;
  document.getElementById('btnSubmit').disabled = true;
  document.getElementById('btnHint').style.display = 'none';
  document.getElementById('btnGiveUp').style.display = 'none';
  const fb = document.getElementById('feedback');
  fb.className = 'feedback visible wrong';
  fb.textContent = 'Revealed. Study the entry and try again tomorrow.';
  showReveal();
  showShare(false, attempts);
  saveHistory(false);
  updateStreak(false);
}

// ── Reveal ─────────────────────────────────────────────────────────────
function showReveal() {
  const card = document.getElementById('revealCard');
  card.classList.add('visible');

  const badge = document.getElementById('revealBadge');
  badge.textContent = challenge.entry_type;
  badge.setAttribute('style', typeStyle(challenge.entry_type) + ';font-family:"JetBrains Mono",monospace;font-size:0.62rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;padding:3px 10px;border-radius:4px');

  document.getElementById('revealId').textContent = challenge.entry_id;
  document.getElementById('revealName').textContent = challenge.entry_name;
  document.getElementById('revealTier').textContent = `Tier: ${challenge.tier}`;
  document.getElementById('revealSolution').textContent = challenge.solution;
  document.getElementById('revealNote').innerHTML = challenge.note;

  const slug = challenge.entry_id.toLowerCase().replace('-', '-');
  document.getElementById('revealLink').href = `/learn/${slug}/`;
}

// ── Share ──────────────────────────────────────────────────────────────
function showShare(won, att) {
  const dateStr = today.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
  let squares = '';
  for (let i = 0; i < att - (won ? 1 : 0); i++) squares += '🟨';
  if (won) squares += '🟩';
  else squares += '🟥';

  const text = `Daily Grid #${challengeNum} — ${dateStr}\n${squares}\n\nexcelligence.dev/daily`;
  document.getElementById('shareText').textContent = text;
  document.getElementById('shareSection').classList.add('visible');
}

function copyShare() {
  const text = document.getElementById('shareText').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const msg = document.getElementById('copiedMsg');
    msg.classList.add('show');
    setTimeout(() => msg.classList.remove('show'), 2000);
  });
}

// ── History ────────────────────────────────────────────────────────────
function saveHistory(won) {
  const hist = JSON.parse(localStorage.getItem(LS_HIST) || '[]');
  const existing = hist.findIndex(h => h.date === todayKey());
  const entry = {date: todayKey(), solved: won, attempts, challengeNum};
  if (existing >= 0) hist[existing] = entry; else hist.push(entry);
  if (hist.length > 90) hist.splice(0, hist.length - 90);
  localStorage.setItem(LS_HIST, JSON.stringify(hist));
}

init();
</script>
